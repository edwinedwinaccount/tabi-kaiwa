<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E7EEEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10161E" media="(prefers-color-scheme: dark)">
<title>Tabi Kaiwa</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='none' stroke='%23C8452F' stroke-width='5'/%3E%3Ctext x='32' y='43' font-size='30' text-anchor='middle' fill='%23C8452F' font-family='sans-serif' font-weight='700'%3E旅%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Tabi Kaiwa. Layout: phone-first single column of "train ticket" cards on security-print stock, bottom tab bar.
   Rounded kana face for Japanese, mono for ticket labels and romaji, vermilion only for stamps. */
:root{
  --stock:#E7EEEA; --stock-line:#D9E3DE; --paper:#F9FBF9; --ink:#1E2944; --muted:#5A6873; --rule:#C9D5D0;
  --accent:#23725F; --accent-soft:#D5E8E1; --stamp:#C8452F;
  --again:#B3402E; --hard:#9A6B12; --good:#23725F; --easy:#2F5DA8;
  --fix-bg:#FFF6E3; --fix-line:#E6C77E; --right-bg:#DDF0E8; --wrong-bg:#F8E1DC;
  --f-jp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --f-ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --stock:#10161E; --stock-line:#151D27; --paper:#18212C; --ink:#E4EAF0; --muted:#94A3AF; --rule:#2B3743;
  --accent:#5CC0A4; --accent-soft:#1D3530; --stamp:#EC7B66;
  --again:#E3725F; --hard:#D6A44A; --good:#5CC0A4; --easy:#7DA6EC;
  --fix-bg:#2A2416; --fix-line:#6B5A2E; --right-bg:#173229; --wrong-bg:#3A1F1A; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;min-height:100%}
body{background:var(--stock);background-image:repeating-linear-gradient(135deg,var(--stock-line) 0 1px,transparent 1px 7px);
  color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body.no-romaji .r{display:none!important}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
p{margin:0} h1,h2,h3{margin:0;text-wrap:balance}
input,textarea,select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:11px 12px;font-size:16px;width:100%}
textarea{resize:vertical;min-height:80px}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:5px}

#main{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:16px;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
body.in-player #main{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
body.in-player .nav{display:none}
.col{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--rule);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:0;padding:5px 2px;border-radius:10px;color:var(--muted)}
.nav .ni{font-family:var(--f-jp);font-weight:700;font-size:15px}
.nav .nl{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.nav button[aria-current="true"]{color:var(--ink);background:var(--accent-soft)}

.pagehead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pagehead h1{font-family:var(--f-jp);font-size:24px;font-weight:700}
.pagehead h1 small{font-family:var(--f-mono);font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-left:8px}
.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.en{font-size:16px}
.why{font-size:15px;line-height:1.6;max-width:62ch}
.meaning{font-size:20px;font-weight:700}
.banner{border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted)}
.banner.warn{background:var(--fix-bg);border-color:var(--fix-line);color:var(--ink)}

.ticket{background:var(--paper);border:1px solid var(--rule);border-radius:12px;position:relative;overflow:hidden}
.ticket .head{display:flex;justify-content:space-between;gap:10px;padding:10px 16px;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--rule)}
.ticket .body{padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.ticket .foot{padding:0 16px 16px;display:flex;gap:8px;flex-wrap:wrap}
.perf{height:0;border-top:2px dashed var(--rule);margin:0 12px;position:relative}
.perf::before,.perf::after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;background:var(--stock);border:1px solid var(--rule)}
.perf::before{left:-22px}.perf::after{right:-22px}

.btn{border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:11px 14px;font-weight:500;font-size:15px;text-align:center}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.btn.wide{flex:1;padding:14px}
.btn.small{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.listen{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:5px 12px;font-size:12px;font-family:var(--f-mono);letter-spacing:.06em;color:var(--accent);white-space:nowrap}
.linkish{border:0;background:none;padding:0;color:var(--accent);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.pill{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:3px 10px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--muted)}
.pill[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;padding:7px 11px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:500}
.progress{height:6px;background:var(--rule);border-radius:999px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);border-radius:999px}

/* word-by-word breakdown */
.il{display:flex;flex-wrap:wrap;gap:8px 2px;align-items:flex-start}
.w{display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 5px 4px;border-radius:8px;border:1px solid transparent;background:transparent;min-width:0}
.w .k{font-family:var(--f-jp);font-weight:700;font-size:23px;line-height:1.3}
.w .r{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.w .g{font-size:12px;color:var(--accent);text-align:center;max-width:10em;line-height:1.3}
.w .g.part{color:var(--hard)}
.w.new .k{color:var(--accent)}
.w.ghost{opacity:.16}
.w.slot{border:1px dashed var(--accent);background:var(--accent-soft)}
.il.sm .w .k{font-size:18px}
.il.lg .w .k{font-size:29px}
.big-kana{font-family:var(--f-jp);font-weight:700;font-size:44px;line-height:1.2;letter-spacing:.02em;overflow-wrap:anywhere}
.big-r{font-family:var(--f-mono);font-size:14px;color:var(--muted)}
.morae{display:flex;flex-wrap:wrap;gap:4px}
.mora{display:flex;flex-direction:column;align-items:center;border:1px solid var(--rule);border-radius:6px;padding:3px 7px;min-width:34px}
.mora .k{font-family:var(--f-jp);font-size:17px;font-weight:700}
.mora .rr{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.grid-set{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.grid-set button{border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:1px}
.grid-set .k{font-family:var(--f-jp);font-weight:700;font-size:17px}
.grid-set .r{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.grid-set .g{font-size:12px;color:var(--accent)}

/* home */
.hero{display:grid;grid-template-columns:118px 1fr;gap:12px;align-items:center}
.hero .char{width:118px;height:118px}
.bubble-say{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:10px 12px;position:relative;display:flex;flex-direction:column;gap:4px;min-width:0}
.bubble-say::before{content:"";position:absolute;left:-7px;top:26px;width:12px;height:12px;background:var(--paper);border-left:1px solid var(--rule);border-bottom:1px solid var(--rule);transform:rotate(45deg)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:8px 10px;font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.stat b{display:block;font-size:22px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:0}
.todo{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--rule);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.todo:first-of-type{border-top:0}
.todo .tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--rule);display:grid;place-items:center;font-size:13px;color:var(--paper)}
.todo.done .tick{background:var(--accent);border-color:var(--accent)}
.todo .t{font-weight:700}
.todo .s{font-size:13px;color:var(--muted)}
.chev{color:var(--muted);font-family:var(--f-mono)}

/* route */
.station{display:flex;align-items:center;gap:10px;margin-top:6px}
.station .plate{white-space:nowrap;flex:none;background:var(--ink);color:var(--paper);border-radius:8px;padding:6px 14px;font-family:var(--f-jp);font-weight:700;font-size:18px;position:relative}
.station .plate::after{content:"";position:absolute;left:10px;right:10px;bottom:3px;height:2px;background:var(--accent)}
.station .sub{font-size:13px;color:var(--muted)}
.route{display:flex;flex-direction:column;position:relative;padding-left:26px}
.route::before{content:"";position:absolute;left:10px;top:10px;bottom:10px;width:3px;background:repeating-linear-gradient(var(--rule) 0 8px,transparent 8px 12px)}
.stop{position:relative;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--rule);background:var(--paper);border-radius:12px;padding:10px 12px;margin:4px 0}
.stop::before{content:"";position:absolute;left:-23px;top:50%;width:13px;height:13px;margin-top:-7px;border-radius:50%;background:var(--paper);border:3px solid var(--rule)}
.stop.done::before{background:var(--accent);border-color:var(--accent)}
.stop.next{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.stop.next::before{border-color:var(--ink)}
.stop > div{min-width:0}
.stop .t{font-family:var(--f-jp);font-weight:700;font-size:16px}
.stop .s{font-size:13px;color:var(--muted)}
.stop.boss{border-style:dashed}
.chip{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:3px 8px;border:1px solid var(--rule);color:var(--muted);white-space:nowrap}
.chip.next{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.hanko{width:40px;height:40px;border-radius:50%;border:2.5px solid var(--stamp);color:var(--stamp);display:grid;place-items:center;font-family:var(--f-jp);font-weight:700;font-size:15px;transform:rotate(-12deg);opacity:.9;line-height:1}
.hanko.big{width:64px;height:64px;font-size:22px;border-width:3px;box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4.5px var(--stamp)}
.hanko.empty{border-color:var(--rule);color:transparent;border-style:dashed;transform:none}
.stampbook{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:12px;justify-items:center}
.stampbook .cell{display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--f-mono);font-size:10px;color:var(--muted)}

/* player */
.player-top{display:flex;align-items:center;gap:10px}
.player-top .progress{flex:1}
.count{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:13px 14px;font-size:15px}
.opt.jp{font-family:var(--f-jp);font-weight:700;font-size:18px}
.opt.right{background:var(--right-bg);border-color:var(--good)}
.opt.wrong{background:var(--wrong-bg);border-color:var(--again)}
.tray{min-height:62px;border:1px dashed var(--rule);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tray.right{background:var(--right-bg);border-style:solid;border-color:var(--good)}
.tray.wrong{background:var(--wrong-bg);border-style:solid;border-color:var(--again)}
.tiles{display:flex;flex-wrap:wrap;gap:6px}
.tile{border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:7px 11px;display:flex;flex-direction:column;align-items:center}
.tile .k{font-family:var(--f-jp);font-weight:700;font-size:20px}
.tile .r{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.tile:disabled{opacity:.25}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:6px 12px;font-family:var(--f-jp);font-weight:700;font-size:16px}
.chipbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.verdict{font-weight:700}
.verdict.right{color:var(--good)}.verdict.wrong{color:var(--again)}.verdict.close{color:var(--hard)}
.mic{width:76px;height:76px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);display:grid;place-items:center;font-family:var(--f-jp);font-weight:700;font-size:15px;flex:none}
.mic.live{background:var(--stamp);border-color:var(--stamp);color:#fff;animation:pulse 1.2s ease-in-out infinite}
.mic.small{width:54px;height:54px;font-size:12px}
.heard{font-family:var(--f-jp);font-size:17px;min-height:1.5em}

/* review */
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:14px 12px}
.grades button{border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:700;font-size:14px}
.grades button span{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted)}
.grades .again{color:var(--again)}.grades .hard{color:var(--hard)}.grades .good{color:var(--good)}.grades .easy{color:var(--easy)}
.prompt{font-size:21px;line-height:1.4;text-wrap:balance}

/* talk */
.scenes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.scenes button{text-align:left;border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.scenes button b{font-family:var(--f-jp);font-size:15px}
.scenes button span{font-size:12px;color:var(--muted)}
.scenes button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.goals{display:flex;flex-direction:column;gap:4px;font-size:13px}
.goals div{display:flex;gap:8px;align-items:baseline;color:var(--muted)}
.goals div.ok{color:var(--good)}
.chat{display:flex;flex-direction:column;gap:14px}
.msg{max-width:100%;display:flex;flex-direction:column;gap:4px;min-width:0}
.msg.them{align-self:flex-start}
.msg.me{align-self:flex-end;align-items:flex-end;max-width:94%}
.bubble{border-radius:12px;padding:10px 12px;border:1px solid var(--rule);background:var(--paper);overflow-wrap:anywhere;display:flex;flex-direction:column;gap:8px;min-width:0}
.msg.me .bubble{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.msg.me .bubble .w .k{color:var(--paper)}
.msg.me .bubble .w .r{color:var(--rule)}
.msg.me .bubble .raw{font-family:var(--f-jp);font-size:17px}
.who{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fix{background:var(--fix-bg);border:1px solid var(--fix-line);border-radius:10px;padding:10px 12px;max-width:100%;display:flex;flex-direction:column;gap:6px;text-align:left}
.ok{font-family:var(--f-mono);font-size:11px;color:var(--good)}
.talkbar{position:sticky;bottom:calc(74px + env(safe-area-inset-bottom,0px));background:var(--stock);border:1px solid var(--rule);border-radius:14px;padding:10px;display:flex;gap:10px;align-items:center}
.talkbar input{flex:1;min-width:0}
.typing{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

/* lists */
.group h3{margin:4px 0 8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:15px}
.group h3 .jpl{font-family:var(--f-jp)}
.group h3 small{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted)}
.plist{background:var(--paper);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.pitem{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;padding:10px 12px;border-top:1px solid var(--rule)}
.pitem:first-child{border-top:0}
.pitem > div{min-width:0}
.pitem.heard{background:color-mix(in srgb,var(--accent-soft) 45%,var(--paper))}
.menu{background:var(--paper);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.menu button{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--rule);background:none;padding:13px 14px}
.menu button:first-child{border-top:0}
.menu .t{font-weight:700}.menu .s{font-size:13px;color:var(--muted)}
details.sect{background:var(--paper);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
details.sect summary{padding:12px 14px;cursor:pointer;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;list-style:none}
details.sect summary::-webkit-details-marker{display:none}
details.sect summary .jpl{font-family:var(--f-jp);font-weight:700}
details.sect summary small{color:var(--muted);font-size:13px}
details.sect .plist{border:0;border-top:1px solid var(--rule);border-radius:0}

/* kana + games */
.kana-table{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.kana-table button{border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:6px 2px;display:flex;flex-direction:column;align-items:center}
.kana-table button.blank{visibility:hidden}
.kana-table .k{font-family:var(--f-jp);font-weight:700;font-size:21px}
.kana-table .rr{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.game-q{font-family:var(--f-jp);font-weight:700;font-size:64px;text-align:center;line-height:1.2;padding:10px 0}
.game-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.game-opts .opt{text-align:center;font-family:var(--f-mono);font-size:18px;padding:16px 8px;font-variant-numeric:tabular-nums}
.game-opts .opt.jp{font-family:var(--f-jp)}
.timer{height:6px;background:var(--rule);border-radius:999px;overflow:hidden}
.timer span{display:block;height:100%;background:var(--stamp)}
.signcard{font-size:56px;font-weight:700;text-align:center;font-family:var(--f-ui);padding:14px 0}

.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick button{border:1px solid var(--rule);background:var(--paper);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.pick button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pick .char{width:84px;height:84px}
.pick b{font-family:var(--f-jp);font-size:14px}
.pick span{font-size:11px;color:var(--muted);line-height:1.3}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:999px;font-size:13px;z-index:50;max-width:90vw;text-align:center}
.celebrate{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:8px 0}
.celebrate .char{width:150px;height:150px}

@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--stamp) 50%,transparent)}50%{box-shadow:0 0 0 12px transparent}}
@media (prefers-reduced-motion:no-preference){
  .flipin{animation:flip .2s ease-out}
  @keyframes flip{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}
  .w.pop{animation:pop .3s ease-out}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
  .hanko.fresh{animation:stampin .45s cubic-bezier(.2,1.4,.4,1)}
  @keyframes stampin{from{transform:rotate(-12deg) scale(2.2);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:.9}}
  .char .bob{animation:bob 3s ease-in-out infinite;transform-origin:50% 100%}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .char.happy .bob{animation:hop .6s ease-in-out 3}
  @keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px)}}
  .char .blink{animation:blink 4.5s infinite;transform-origin:50% 50%;transform-box:fill-box}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
  .char .steam{animation:steam 3s ease-in-out infinite}
  @keyframes steam{0%{opacity:0;transform:translateY(4px)}50%{opacity:.7}100%{opacity:0;transform:translateY(-6px)}}
}

<script type="application/json" id="curriculum">{"version":1,"stages":[{"n":1,"k":"おおさか","en":"Point, count, ask","place":"Osaka"},{"n":2,"k":"きょうと","en":"Doing things","place":"Kyoto"},{"n":3,"k":"ドライブ","en":"Asking and requesting","place":"Road trip: Kyoto prefecture to Kobe"},{"n":4,"k":"ニセコ","en":"On the mountain","place":"Niseko (Hirafu)"},{"n":5,"k":"とうきょう","en":"City and people","place":"Tokyo"}],"W":{"sumimasen":{"k":"すみません","kj":"すみません","r":"sumimasen","g":"excuse me / sorry","why":"Your most useful word. It gets a waiter's attention, apologises, and even thanks someone for a small favour. Calling すみません! across a restaurant is normal, not rude.","stage":1,"L":"L01"},"hai":{"k":"はい","kj":"はい","r":"hai","g":"yes","why":"Also means 'I'm listening' or 'here you go'. People say it constantly just to show they're following.","stage":1,"L":"L01"},"iie":{"k":"いいえ","kj":"いいえ","r":"iie","g":"no","why":"Correct but blunt on its own. You'll soon learn softer ways to turn things down.","stage":1,"L":"L01"},"arigatou":{"k":"ありがとう","kj":"ありがとう","r":"arigatou","g":"thank you","why":"Casual on its own. The う at the end just stretches the お sound: a-ri-ga-too.","stage":1,"L":"L01"},"gozaimasu":{"k":"ございます","kj":"ございます","r":"gozaimasu","g":"(very polite)","why":"A very polite 'there is'. It attaches to set phrases to raise the politeness: ありがとう ございます.","stage":1,"L":"L01"},"onegaishimasu":{"k":"おねがいします","kj":"お願いします","r":"onegaishimasu","g":"please (I ask)","why":"お (polite) + ねがい (a wish) + します (I do): 'I make a request'. Name the thing you want, then add this.","stage":1,"L":"L01"},"konnichiwa":{"k":"こんにちは","kj":"こんにちは","r":"konnichiwa","g":"hello","why":"The daytime greeting. The last は is said 'wa' because it began life as the topic marker: 'as for today...'","stage":1,"L":"L01"},"ohayou":{"k":"おはよう","kj":"おはよう","r":"ohayou","g":"good morning","why":"Add ございます to make it polite, which you should with staff and strangers.","stage":1,"L":"L01"},"konbanwa":{"k":"こんばんは","kj":"こんばんは","r":"konbanwa","g":"good evening","why":"Same build as こんにちは: こんばん (this evening) + は, said 'wa'.","stage":1,"L":"L01"},"douzo":{"k":"どうぞ","kj":"どうぞ","r":"douzo","g":"go ahead / here you are","why":"You'll hear it when someone offers you a seat, a menu or the way through a door.","stage":1,"L":"L01"},"kore":{"k":"これ","kj":"これ","r":"kore","g":"this","why":"Something near you. Point at the menu and say これ.","stage":1,"L":"L02"},"sore":{"k":"それ","kj":"それ","r":"sore","g":"that (by you)","why":"The thing near the person you're talking to, like a dish on their side of the counter.","stage":1,"L":"L02"},"are":{"k":"あれ","kj":"あれ","r":"are","g":"that (over there)","why":"Away from both of you. これ, それ, あれ: the first sound tells you how far away it is.","stage":1,"L":"L02"},"wa":{"k":"は","kj":"は","r":"wa","g":"[topic]","why":"Marks what the sentence is about, like 'as for...'. Written は but said 'wa' in this job.","stage":1,"L":"L02"},"nan":{"k":"なん","kj":"何","r":"nan","g":"what","why":"The question word 'what'. It sits where the answer would go.","stage":1,"L":"L02"},"desu":{"k":"です","kj":"です","r":"desu","g":"is / am / are","why":"The polite 'it is'. Always at the very end. The u is almost silent: 'dess'.","stage":1,"L":"L02"},"ka":{"k":"か","kj":"か","r":"ka","g":"?","why":"Add か to the end and any sentence becomes a question. The word order never changes.","stage":1,"L":"L02"},"niku":{"k":"にく","kj":"肉","r":"niku","g":"meat","why":"Useful for checking what's in a dish.","stage":1,"L":"L02"},"sakana":{"k":"さかな","kj":"魚","r":"sakana","g":"fish","why":"Fish is everywhere in Japanese food, including the stock.","stage":1,"L":"L02"},"yasai":{"k":"やさい","kj":"野菜","r":"yasai","g":"vegetables","why":"You'll need this one for the vegetarian in your group.","stage":1,"L":"L02"},"takoyaki":{"k":"たこやき","kj":"たこ焼き","r":"takoyaki","g":"takoyaki","why":"Osaka's street food: たこ (octopus) + やき (grilled). やき shows up in lots of dish names.","stage":1,"L":"L02"},"sou":{"k":"そう","kj":"そう","r":"sou","g":"so / that's right","why":"そう です means 'that's right'. You'll confirm things with it all day.","stage":1,"L":"L02"},"chigaimasu":{"k":"ちがいます","kj":"違います","r":"chigaimasu","g":"that's not it","why":"Literally 'it differs'. A polite way to say 'no, that's wrong' without a blunt いいえ.","stage":1,"L":"L02"},"n1":{"k":"いち","kj":"一","r":"ichi","g":"1","why":"","set":"num","stage":1,"L":"L03"},"n2":{"k":"に","kj":"二","r":"ni","g":"2","why":"","set":"num","stage":1,"L":"L03"},"n3":{"k":"さん","kj":"三","r":"san","g":"3","why":"","set":"num","stage":1,"L":"L03"},"n4":{"k":"よん","kj":"四","r":"yon","g":"4","why":"Also read し, but よん is the safe everyday choice.","set":"num","stage":1,"L":"L03"},"n5":{"k":"ご","kj":"五","r":"go","g":"5","why":"","set":"num","stage":1,"L":"L03"},"n6":{"k":"ろく","kj":"六","r":"roku","g":"6","why":"","set":"num","stage":1,"L":"L03"},"n7":{"k":"なな","kj":"七","r":"nana","g":"7","why":"Also read しち. なな is clearer and never misheard as いち.","set":"num","stage":1,"L":"L03"},"n8":{"k":"はち","kj":"八","r":"hachi","g":"8","why":"","set":"num","stage":1,"L":"L03"},"n9":{"k":"きゅう","kj":"九","r":"kyuu","g":"9","why":"Also read く in a few set words such as くじ (9 o'clock).","set":"num","stage":1,"L":"L03"},"n10":{"k":"じゅう","kj":"十","r":"juu","g":"10","why":"After ten, numbers stack: じゅういち is 11, にじゅう is 20.","set":"num","stage":1,"L":"L03"},"hitori":{"k":"ひとり","kj":"1人","r":"hitori","g":"one person","why":"People are counted with にん, but one and two are irregular.","set":"people","stage":1,"L":"L03"},"futari":{"k":"ふたり","kj":"2人","r":"futari","g":"two people","why":"The second irregular one. From three onward it's just number + にん.","set":"people","stage":1,"L":"L03"},"sannin":{"k":"さんにん","kj":"3人","r":"sannin","g":"three people","why":"さん (three) + にん (people).","set":"people","stage":1,"L":"L03"},"yonin":{"k":"よにん","kj":"4人","r":"yonin","g":"four people","why":"Careful: よにん, not よんにん.","set":"people","stage":1,"L":"L03"},"gonin":{"k":"ごにん","kj":"5人","r":"gonin","g":"five people","why":"ご (five) + にん (people).","set":"people","stage":1,"L":"L03"},"rokunin":{"k":"ろくにん","kj":"6人","r":"rokunin","g":"six people","why":"ろく (six) + にん (people). Your group's number.","set":"people","stage":1,"L":"L03"},"o":{"k":"を","kj":"を","r":"o","g":"[thing]","why":"Marks the thing being acted on. Written を, said 'o'. It points back at the word before it: 'this is the thing I mean'.","stage":1,"L":"L04"},"kudasai":{"k":"ください","kj":"ください","r":"kudasai","g":"please give me","why":"A direct, polite 'give me'. おねがいします is a touch softer. Both are fine in any restaurant.","stage":1,"L":"L04"},"hitotsu":{"k":"ひとつ","kj":"1つ","r":"hitotsu","g":"one (thing)","why":"The general counter for things. It works for nearly anything on a menu.","set":"thing","stage":1,"L":"L04"},"futatsu":{"k":"ふたつ","kj":"2つ","r":"futatsu","g":"two (things)","why":"","set":"thing","stage":1,"L":"L04"},"mittsu":{"k":"みっつ","kj":"3つ","r":"mittsu","g":"three (things)","why":"The small っ is a tiny pause: mit-tsu.","set":"thing","stage":1,"L":"L04"},"yottsu":{"k":"よっつ","kj":"4つ","r":"yottsu","g":"four (things)","why":"","set":"thing","stage":1,"L":"L04"},"itsutsu":{"k":"いつつ","kj":"5つ","r":"itsutsu","g":"five (things)","why":"","set":"thing","stage":1,"L":"L04"},"muttsu":{"k":"むっつ","kj":"6つ","r":"muttsu","g":"six (things)","why":"One each for your whole group.","set":"thing","stage":1,"L":"L04"},"nanatsu":{"k":"ななつ","kj":"7つ","r":"nanatsu","g":"seven (things)","why":"","set":"thing","stage":1,"L":"L04"},"yattsu":{"k":"やっつ","kj":"8つ","r":"yattsu","g":"eight (things)","why":"","set":"thing","stage":1,"L":"L04"},"kokonotsu":{"k":"ここのつ","kj":"9つ","r":"kokonotsu","g":"nine (things)","why":"","set":"thing","stage":1,"L":"L04"},"too":{"k":"とお","kj":"10","r":"too","g":"ten (things)","why":"The only one without つ.","set":"thing","stage":1,"L":"L04"},"biiru":{"k":"ビール","kj":"ビール","r":"biiru","g":"beer","why":"The long line ー stretches the vowel before it: bii-ru.","stage":1,"L":"L04"},"omizu":{"k":"おみず","kj":"お水","r":"omizu","g":"water","why":"お (polite) + みず (water). Free water is normal in restaurants.","stage":1,"L":"L04"},"ocha":{"k":"おちゃ","kj":"お茶","r":"ocha","g":"tea","why":"お (polite) + ちゃ (tea). Usually green, and often free.","stage":1,"L":"L04"},"karaage":{"k":"からあげ","kj":"唐揚げ","r":"karaage","g":"fried chicken","why":"An izakaya staple that everyone orders.","stage":1,"L":"L04"},"edamame":{"k":"えだまめ","kj":"枝豆","r":"edamame","g":"edamame","why":"えだ (branch) + まめ (bean). A safe vegetarian starter.","stage":1,"L":"L04"},"to":{"k":"と","kj":"と","r":"to","g":"and","why":"Joins nouns: A と B. Only for things, not for joining sentences.","stage":1,"L":"L05"},"mo":{"k":"も","kj":"も","r":"mo","g":"also / too","why":"Takes the place of は or を to mean 'too'.","stage":1,"L":"L05"},"watashi":{"k":"わたし","kj":"私","r":"watashi","g":"I / me","why":"Japanese drops 'I' whenever it's obvious, so you'll use this less than you expect.","stage":1,"L":"L05"},"haibooru":{"k":"ハイボール","kj":"ハイボール","r":"haibooru","g":"highball","why":"Whisky and soda. On every izakaya menu.","stage":1,"L":"L05"},"remonsawaa":{"k":"レモンサワー","kj":"レモンサワー","r":"remonsawaa","g":"lemon sour","why":"Shochu, soda and lemon. The other izakaya classic.","stage":1,"L":"L05"},"uuroncha":{"k":"ウーロンちゃ","kj":"ウーロン茶","r":"uuroncha","g":"oolong tea","why":"The standard non-alcoholic order at an izakaya.","stage":1,"L":"L05"},"gohan":{"k":"ごはん","kj":"ご飯","r":"gohan","g":"rice / a meal","why":"Means cooked rice, and by extension a meal.","stage":1,"L":"L05"},"yakitori":{"k":"やきとり","kj":"焼き鳥","r":"yakitori","g":"grilled chicken skewers","why":"やき (grilled) + とり (bird). The same やき as in たこやき.","stage":1,"L":"L05"},"okonomiyaki":{"k":"おこのみやき","kj":"お好み焼き","r":"okonomiyaki","g":"okonomiyaki","why":"おこのみ (as you like it) + やき (grilled). Osaka's savoury pancake.","stage":1,"L":"L05"},"toriaezu":{"k":"とりあえず","kj":"とりあえず","r":"toriaezu","g":"to start with","why":"'For now'. とりあえず ビール is such a common opener it's practically a proverb.","stage":1,"L":"L05"},"ijou":{"k":"いじょう","kj":"以上","r":"ijou","g":"that's all","why":"Signals the end of your order.","stage":1,"L":"L05"},"mou":{"k":"もう","kj":"もう","r":"mou","g":"more / another","why":"Adds 'one more': もう いちど is 'one more time', もう ひとつ is 'one more'.","stage":1,"L":"L06"},"ichido":{"k":"いちど","kj":"一度","r":"ichido","g":"one time","why":"いち (one) + ど (times).","stage":1,"L":"L06"},"yukkuri":{"k":"ゆっくり","kj":"ゆっくり","r":"yukkuri","g":"slowly","why":"Also means 'relaxed'. Staff may say ごゆっくり: 'take your time'.","stage":1,"L":"L06"},"wakarimasu":{"k":"わかります","kj":"わかります","r":"wakarimasu","g":"understand","why":"Polite verbs end in ます.","stage":1,"L":"L06"},"wakarimasen":{"k":"わかりません","kj":"わかりません","r":"wakarimasen","g":"don't understand","why":"ます becomes ません and the verb turns negative.","stage":1,"L":"L06"},"wakarimashita":{"k":"わかりました","kj":"わかりました","r":"wakarimashita","g":"understood / got it","why":"ます becomes ました for the past: 'I have understood'. Use it to accept what you've been told.","stage":1,"L":"L06"},"eigo":{"k":"えいご","kj":"英語","r":"eigo","g":"English","why":"えい (England) + ご (language).","stage":1,"L":"L06"},"nihongo":{"k":"にほんご","kj":"日本語","r":"nihongo","g":"Japanese","why":"にほん (Japan) + ご (language).","stage":1,"L":"L06"},"sukoshi":{"k":"すこし","kj":"少し","r":"sukoshi","g":"a little","why":"Softens anything: すこし わかります.","stage":1,"L":"L06"},"chotto":{"k":"ちょっと","kj":"ちょっと","r":"chotto","g":"a bit","why":"The casual twin of すこし. Said alone with a trailing voice, ちょっと... is how people say no without saying no.","stage":1,"L":"L06"},"madamada":{"k":"まだまだ","kj":"まだまだ","r":"madamada","g":"not yet at all","why":"The modest reply to any compliment: 'still a long way to go'.","stage":1,"L":"L06"},"doko":{"k":"どこ","kj":"どこ","r":"doko","g":"where","why":"Same family as これ: ここ, そこ, あそこ, and the question form どこ.","stage":1,"L":"L07"},"toire":{"k":"トイレ","kj":"トイレ","r":"toire","g":"toilet","why":"Katakana is for borrowed words, so d it's on the right."},{"id":"L07h3","t":[{"w":"soko"},{"w":"o"},{"w":"hidari"},{"w":"desu"}],"kj":"そこを左です","en":"Turn left there."}]},{"id":"L08","stage":1,"k":"ありますか","en":"Having and existing","can":"Ask if they have something, and say you have a booking","point":"あります means 'there is' or 'I have', for things. います is the same for people. が marks the thing that exists. In questions and negatives, は usually takes over: メニュー は ありますか. の links two nouns: えいご の メニュー.","words":["arimasu","arimasen","imasu","ga","no","menyuu","yoyaku","seki","namae","waifai"],"forms":[],"frames":[{"id":"L08f1","t":[{"slot":1},{"w":"wa"},{"w":"arimasu"},{"w":"ka"}],"en":"Do you have ___?","slot":["menyuu","waifai","seki","toire"]}],"phrases":[{"id":"L08p1","t":[{"w":"eigo"},{"w":"no"},{"w":"menyuu"},{"w":"wa"},{"w":"arimasu"},{"w":"ka"}],"kj":"英語のメニューはありますか","en":"Do you have an English menu?"},{"id":"L08p2","t":[{"w":"yoyaku"},{"w":"ga"},{"w":"arimasu"}],"kj":"予約があります","en":"I have a booking."},{"id":"L08p3","t":[{"w":"yoyaku"},{"w":"wa"},{"w":"arimasen"}],"kj":"予約はありません","en":"I don't have a booking."},{"id":"L08p4","t":[{"w":"rokunin"},{"w":"imasu"}],"kj":"6人います","en":"There are six of us."},{"id":"L08p5","t":[{"w":"rokunin"},{"w":"desu"},{"p":"。"},{"w":"seki"},{"w":"wa"},{"w":"arimasu"},{"w":"ka"}],"kj":"6人です。席はありますか","en":"There are six of us. Do you have a table?"},{"id":"L08p6","t":[{"w":"namae"},{"w":"wa"},{"name":1},{"w":"desu"}],"kj":"名前は〇〇です","en":"The name is ___."},{"id":"L08p7","t":[{"w":"waifai"},{"w":"wa"},{"w":"arimasu"},{"w":"ka"}],"kj":"Wi-Fiはありますか","en":"Do you have Wi-Fi?"}],"hear":[{"id":"L08h1","t":[{"k":"ごよやく","g":"your booking","r":"goyoyaku"},{"w":"no"},{"k":"おなまえ","g":"your name","r":"onamae"},{"w":"wa"}],"kj":"ご予約のお名前は","en":"The name on the booking?"},{"id":"L08h2","t":[{"k":"もうしわけ","g":"excuse","r":"moushiwake"},{"k":"ございません","g":"there is none","r":"gozaimasen"},{"p":"、"},{"k":"まんせき","g":"full","r":"manseki"},{"w":"desu"}],"kj":"申し訳ございません、満席です","en":"I'm ver t":[{"k":"だいきち","g":"great luck","r":"daikichi"},{"k":"ですね","g":"isn't it","r":"desune"}],"kj":"大吉ですね","en":"Great luck!","tip":"The best fortune you can draw."}]}],"bosses":[{"stage":1,"id":"B1","k":"いざかや","en":"The izakaya","role":"a server at a busy izakaya in Osaka","setting":"Get a table for your group of six, order drinks and food in the right quantities, and pay.","goals":["Say how many people you are","Order at least two different drinks with quantities","Order two dishes","Ask for the bill and say how you'll pay"]},{"stage":2,"id":"B2","k":"おてら","en":"The temple visit","role":"a ticket seller at a Kyoto temple, and then a taxi driver","setting":"Buy tickets for your group, ask what time it closes, then take a taxi back to your hotel.","goals":["Buy the right number of adult tickets","Ask the closing time","Say something about the temple","Tell the taxi driver where to go"]},{"stage":3,"id":"B3","k":"りょかん","en":"The ryokan","role":"the host at a small-town ryokan","setting":"Arrive with your group of six, check in, sort out dinner and food needs, and find the bath.","goals":["Check in under your booking name","Confirm how many people and nights","Explain the group's food needs","Ask about dinner time and the bath"]},{"stage":4,"id":"B4","k":"レンタルショップ","en":"The rental shop","role":"a staff member at a ski rental shop in Hirafu","setting":"Rent your gear for the right number of days, sort out sizes, and ask about lift passes and today's conditions.","goals":["Say what you want to rent and for how long","Give your boot size and level","Ask for a different size","Ask whether the gondola is running"]},{"stage":5,"id":"B5","k":"おおみそか","en":"New Year's Eve","role":"a friendly local you've just been introduced to at a New Year's Eve gathering in Tokyo","setting":"Introduce yourself, chat about your trip, toast, and get the greetings right on both sides of midnight.","goals":["Introduce yourself and say where you're from","Say something about what you did on the trip","React naturally to what they say","Give the right New Year greeting"]}],"kana":{"lessons":[{"id":"K1","k":"ひらがな","en":"Hiragana refresher","can":"Read every hiragana again, including the marks and small letters","point":"Hiragana writes native Japanese words and all the grammar. Two marks change a sound: ゛ turns か into が, and ゜ turns は into ぱ. A small ゃ, ゅ or ょ blends with the kana before it (きゃ), and a small っ is a short pause before the next sound.","practice":[["すし","sushi","sushi"],["さけ","sake","sake"],["おちゃ","tea","ocha"],["みず","water","mizu"],["えき","station","eki"],["みぎ","right","migi"],["ひだり","left","hidari"],["きっぷ","ticket","kippu"],["りょかん","ryokan","ryokan"],["おんせん","hot spring","onsen"],["ゆき","snow","yuki"],["やま","mountain","yama"],["きょうと","Kyoto","kyouto"],["とうきょう","Tokyo","toukyou"],["おおさか","Osaka","oosaka"],["ありがとう","thank you","arigatou"],["すみません","excuse me","sumimasen"],["だいじょうぶ","OK / fine","daijoubu"]]},{"id":"K2","k":"カタカナ","en":"Katakana refresher","can":"Sound out menus and signs written in katakana","point":"Katakana writes borrowed words, so sounding one out often gives you the English. The line ー stretches the vowel before it (ビール is bii-ru). Small ァィゥェォ make sounds Japanese didn't have, such as ファ (fa) and ウィ (wi).","practice":[["ビール","beer","biiru"],["コーヒー","coffee","koohii"],["ラーメン","ramen","raamen"],["カレー","curry","karee"],["メニュー","menu","menyuu"],["トイレ","toilet","toire"],["ホテル","hotel","hoteru"],["タクシー","taxi","takushii"],["バス","bus","basu"],["レストラン","restaurant","resutoran"],["コンビニ","convenience store","konbini"],["スキー","ski","sukii"],["レンタカー","rental car","rentakaa"],["チェックイン","check-in","chekkuin"],["カード","card","kaado"],["サイズ","size","saizu"],["ワイン","wine","wain"],["ハイボール","highball","haibooru"],["サラダ","salad","sarada"],["チーズ","cheese","chiizu"],["ジュース","juice","juusu"],["テーブル","table","teeburu"],["ニセコ","Niseko","niseko"],["オーストラリア","Australia","oosutoraria"]]}],"confusable":[["シ","ツ"],["ソ","ン"],["ク","ケ"],["ウ","ワ"],["ぬ","め"],["ね","れ","わ"],["は","ほ"],["さ","き"],["る","ろ"],["コ","ユ"]]},"signs":[{"s":"入口","k":"いりぐち","r":"iriguchi","g":"entrance","where":"Doors, car parks, expressway ramps"},{"s":"出口","k":"でぐち","r":"deguchi","g":"exit","where":"Stations, car parks, expressway ramps"},{"s":"非常口","k":"ひじょうぐち","r":"hijouguchi","g":"emergency exit","where":"Green running-figure signs"},{"s":"男","k":"おとこ","r":"otoko","g":"men","where":"Toilets and baths, often blue"},{"s":"女","k":"おんな","r":"onna","g":"women","where":"Toilets and baths, often red"},{"s":"お手洗い","k":"おてあらい","r":"otearai","g":"toilets","where":"The polite word, on signs in restaurants and stations"},{"s":"湯","k":"ゆ","r":"yu","g":"hot bath","where":"On the curtain at the entrance to a bath"},{"s":"止まれ","k":"とまれ","r":"tomare","g":"stop","where":"Red upside-down triangle road sign, and painted on the road"},{"s":"徐行","k":"じょこう","r":"jokou","g":"slow down","where":"Road signs near crossings and narrow streets"},{"s":"一方通行","k":"いっぽうつうこう","r":"ippoutsuukou","g":"one way","where":"Blue arrow road sign"},{"s":"駐車場","k":"ちゅうしゃじょう","r":"chuushajou","g":"car park","where":"Often shortened to a large P"},{"s":"駐車禁止","k":"ちゅうしゃきんし","r":"chuushakinshi","g":"no parking","where":"Road signs and private driveways"},{"s":"満車","k":"まんしゃ","r":"mansha","g":"car park full","where":"Lit in red at car park entrances"},{"s":"空車","k":"くうしゃ","r":"kuusha","g":"spaces free / taxi available","where":"Lit at car park entrances and on taxi dashboards"},{"s":"精算","k":"せいさん","r":"seisan","g":"pay here","where":"On car park payment machines and station fare-adjustment machines"},{"s":"無料","k":"むりょう","r":"muryou","g":"free of charge","where":"Parking, Wi-Fi, refills"},{"s":"有料","k":"ゆうりょう","r":"yuuryou","g":"charges apply","where":"Toll roads and paid parking"},{"s":"営業中","k":"えいぎょうちゅう","r":"eigyouchuu","g":"open","where":"On the door of shops and restaurants"},{"s":"準備中","k":"じゅんびちゅう","r":"junbichuu","g":"closed for now","where":"Restaurants between lunch and dinner service"},{"s":"定休日","k":"ていきゅうび","r":"teikyuubi","g":"regular closing day","where":"Followed by the day of the week the place shuts"},{"s":"禁煙","k":"きんえん","r":"kinen","g":"no smoking","where":"Restaurants, hotel rooms, train cars"},{"s":"立入禁止","k":"たちいりきんし","r":"tachiirikinshi","g":"no entry","where":"Roped-off areas, including out-of-bounds ski terrain"},{"s":"押す","k":"おす","r":"osu","g":"push","where":"Doors and buttons"},{"s":"引く","k":"ひく","r":"hiku","g":"pull","where":"Doors"},{"s":"大人","k":"おとな","r":"otona","g":"adult","where":"Ticket machines and price boards"},{"s":"小人","k":"こども","r":"kodomo","g":"child","where":"Ticket machines and price boards"},{"s":"円","k":"えん","r":"en","g":"yen","where":"Every price tag"},{"s":"駅","k":"えき","r":"eki","g":"station","where":"Road signs and maps"}]}</script>
<script>
(function(){
"use strict";
/* ===================== DATA ===================== */
const DATA=JSON.parse(document.getElementById("curriculum").textContent);
const W=DATA.W, LESSONS=DATA.lessons, BOSSES=DATA.bosses, STAGES=DATA.stages, KANA=DATA.kana, SIGNS=DATA.signs;
const LMAP={},PMAP={},HMAP={},FMAP={};
LESSONS.forEach((l,i)=>{l.i=i;LMAP[l.id]=l;l.phrases.forEach(p=>{p.L=l.id;PMAP[p.id]=p;});l.hear.forEach(h=>{h.L=l.id;HMAP[h.id]=h;});l.frames.forEach(f=>{f.L=l.id;FMAP[f.id]=f;});});
KANA.lessons.forEach(k=>{LMAP[k.id]=k;k.kana=true;});
// the order of the whole path: two kana refreshers, then lessons 1-34
const PATH=KANA.lessons.map(k=>k.id).concat(LESSONS.map(l=>l.id));
const NO_SRS_SETS={num:1,time:1,minutes:1};

/* ===================== STATE ===================== */
const LS_KEY="tabi.v3";
function blank(){return {v:3,char:null,name:"",group:6,food:"",tripDate:"",key:"",model:"claude-sonnet-5-5",romaji:true,rate:0.85,level:"known",
  dir:"ja",signs:false,done:{},boss:{},cards:{},custom:[],log:{},best:{},seenTip:{},updatedAt:0};}
function normalize(s){const b=blank();if(!s||typeof s!=="object")return b;
  Object.keys(b).forEach(k=>{if(s[k]===undefined||s[k]===null&&b[k]!==null)return;if(typeof b[k]==="object"&&b[k]!==null&&!Array.isArray(b[k])){if(s[k]&&typeof s[k]==="object")b[k]=s[k];}
    else if(Array.isArray(b[k])){if(Array.isArray(s[k]))b[k]=s[k];}else b[k]=s[k];});return b;}
let S=(function(){try{const r=localStorage.getItem(LS_KEY);return r?normalize(JSON.parse(r)):blank();}catch(e){return blank();}})();
let saveTimer=null,storageOK=true;
function save(){S.updatedAt=Date.now();clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem(LS_KEY,JSON.stringify(S));storageOK=true;}catch(e){storageOK=false;}},150);}
window.addEventListener("pagehide",()=>{try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}});

/* ===================== HELPERS ===================== */
const $=id=>document.getElementById(id);
function el(tag,cls,text,attrs){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;if(attrs)for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}
function btn(cls,text,fn,id){const b=el("button",cls,text);b.type="button";if(id)b.id=id;if(fn)b.addEventListener("click",fn);return b;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(a,n){return shuffle(a).slice(0,n);}
function uniq(a){return [...new Set(a)];}
const DAY=864e5;
function dstr(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function today(){return dstr();}
let toastTimer=null;
function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true;},2600);}
function logAct(kind,n){const d=today();S.log[d]=S.log[d]||{};S.log[d][kind]=(S.log[d][kind]||0)+(n||1);save();}
function didToday(kind){const l=S.log[today()];return !!(l&&l[kind]);}
function streak(){let n=0;const d=new Date();if(!S.log[dstr(d)])d.setDate(d.getDate()-1);
  while(S.log[dstr(d)]){n++;d.setDate(d.getDate()-1);}return n;}
function fmtDur(days){if(days<1/24)return Math.max(1,Math.round(days*1440))+" min";if(days<1)return Math.round(days*24)+" h";if(days<14)return Math.round(days)+" d";if(days<30)return Math.round(days/7)+" wk";return Math.round(days/30)+" mo";}

/* ===================== KANA ===================== */
const HIRA="あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをんがぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽ";
const HROM="a i u e o ka ki ku ke ko sa shi su se so ta chi tsu te to na ni nu ne no ha hi fu he ho ma mi mu me mo ya yu yo ra ri ru re ro wa o n ga gi gu ge go za ji zu ze zo da ji zu de do ba bi bu be bo pa pi pu pe po".split(" ");
const KMAP={};for(let i=0;i<HIRA.length;i++){KMAP[HIRA[i]]=HROM[i];KMAP[String.fromCharCode(HIRA.charCodeAt(i)+96)]=HROM[i];}KMAP["ヴ"]="vu";
const SMALL_Y={"ゃ":"a","ゅ":"u","ょ":"o","ャ":"a","ュ":"u","ョ":"o"};
const SMALL_V={"ぁ":"a","ぃ":"i","ぅ":"u","ぇ":"e","ぉ":"o","ァ":"a","ィ":"i","ゥ":"u","ェ":"e","ォ":"o"};
function morae(s){const out=[];
  for(const ch of s){if(ch===" ")continue;const prev=out[out.length-1];
    if(SMALL_Y[ch]&&prev){const b=prev.r,v=SMALL_Y[ch];prev.r=/^(shi|chi|ji)$/.test(b)?b.slice(0,-1)+v:b.slice(0,-1)+"y"+v;prev.k+=ch;continue;}
    if(SMALL_V[ch]&&prev){const b=prev.r,v=SMALL_V[ch];prev.r=(b==="u"?"w":b==="te"?"t":b==="de"?"d":b==="fu"?"f":b.replace(/[aiueo]+$/,""))+v;prev.k+=ch;continue;}
    if(ch==="ー"){out.push({k:ch,r:"long"});continue;}
    if(ch==="っ"||ch==="ッ"){out.push({k:ch,r:"pause"});continue;}
    out.push({k:ch,r:KMAP[ch]||ch});}
  return out;}
function toHira(s){return s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));}
function romajiOf(k){let o=[],gem=false;for(const m of morae(k)){if(m.r==="pause"){gem=true;continue;}if(m.r==="long"){const b=o[o.length-1]||"";o.push(b.slice(-1));continue;}let r=m.r;if(gem){r=(r.startsWith("ch")?"t":r[0])+r;gem=false;}o.push(r);}return o.join("");}
// romaji typed the Japanese way -> katakana, for names
function romajiToKata(s){s=s.toLowerCase().replace(/[^a-z\-']/g,"");const T={};
  for(let i=0;i<HIRA.length;i++){const r=HROM[i];if(!(r in T))T[r]=String.fromCharCode(HIRA.charCodeAt(i)+96);}
  Object.assign(T,{si:"シ",ti:"ティ",tu:"ツ",di:"ディ",du:"ドゥ",hu:"フ",zi:"ジ",wi:"ウィ",we:"ウェ",wo:"ウォ",fa:"ファ",fi:"フィ",fe:"フェ",fo:"フォ",va:"ヴァ",vi:"ヴィ",ve:"ヴェ",vo:"ヴォ",vu:"ヴ",she:"シェ",che:"チェ",je:"ジェ",
    kya:"キャ",kyu:"キュ",kyo:"キョ",sha:"シャ",shu:"シュ",sho:"ショ",cha:"チャ",chu:"チュ",cho:"チョ",nya:"ニャ",nyu:"ニュ",nyo:"ニョ",hya:"ヒャ",hyu:"ヒュ",hyo:"ヒョ",mya:"ミャ",myu:"ミュ",myo:"ミョ",rya:"リャ",ryu:"リュ",ryo:"リョ",gya:"ギャ",gyu:"ギュ",gyo:"ギョ",ja:"ジャ",ju:"ジュ",jo:"ジョ",bya:"ビャ",byu:"ビュ",byo:"ビョ",pya:"ピャ",pyu:"ピュ",pyo:"ピョ",
    la:"ラ",li:"リ",lu:"ル",le:"レ",lo:"ロ",ca:"カ",cu:"ク",co:"コ",ci:"シ",ce:"セ",qu:"ク",xa:"ザ",ye:"イェ"});
  let out="",i=0;while(i<s.length){const c=s[i];
    if(c==="-"){out+="ー";i++;continue;}if(c==="'"){i++;continue;}
    if(i+1<s.length&&c===s[i+1]&&!/[aiueon]/.test(c)){out+="ッ";i++;continue;}
    let hit=false;for(const n of [3,2,1]){const seg=s.substr(i,n);if(T[seg]&&seg.length===n){out+=T[seg];i+=n;hit=true;break;}}
    if(hit)continue;
    if(c==="n"){out+="ン";i++;continue;}
    // a consonant with no vowel after it: add the usual helper vowel
    const helper=(c==="t"||c==="d")?"o":"u";const seg=c+helper;out+=T[seg]||"";i++;}
  return out;}

/* ===================== TOKENS ===================== */
// a token is {w:id} | {k,g,r} | {p:punct} | {slot:1} | {name:1}
function res(t){
  if(t.w){const w=W[t.w];return {id:t.w,k:w.k,r:w.r,g:w.g,why:w.why,part:w.g.charAt(0)==="["||w.g==="?"};}
  if(t.name){const n=S.name||"〇〇";return {k:n,r:S.name?romajiOf(S.name):"",g:"your name"};}
  if(t.slot)return {k:"＿",r:"",g:"",slot:true};
  if(t.p)return {p:t.p};
  return {k:t.k,r:t.r||romajiOf(t.k),g:t.g||"",part:(t.g||"").charAt(0)==="["||t.g==="?"};}
function resolve(ts){if(ts._res)return ts;const out=[];ts.forEach(t=>{const r=res(t);if(r.p){if(out.length)out[out.length-1].tail=(out[out.length-1].tail||"")+r.p;}else out.push(r);});out._res=true;return out;}
function toks(p){return p.t||p.line||[];}
function lineText(ts){return resolve(ts).map(x=>x.k+(x.tail||"")).join("");}
function lineSpaced(ts){return resolve(ts).map(x=>x.k+(x.tail||"")).join(" ");}
function parseLine(str){return str.split(/\s+/).filter(Boolean).map(x=>x===","?{p:"、"}:x==="."?{p:"。"}:{w:x});}
// word-by-word row. Tap a word to hear it.
function interlinear(ts,o){o=o||{};const parts=resolve(ts);
  const box=el("div","il"+(o.size?" "+o.size:""));
  parts.forEach((p,i)=>{const b=el("button","w");b.type="button";
    if(o.shown!=null&&i>=o.shown)b.classList.add("ghost");
    if(o.pop===i)b.classList.add("pop");if(o.hi===i)b.classList.add("new");if(p.slot)b.classList.add("slot");
    b.append(el("span","k",p.k+(p.tail||"")));if(p.r)b.append(el("span","r",p.r));
    if(o.gloss!==false)b.append(el("span","g"+(p.part?" part":""),(o.shown!=null&&i>=o.shown)?"·":p.g));
    b.setAttribute("aria-label",p.k+(o.gloss!==false&&p.g?", "+p.g:""));
    if(!p.slot)b.addEventListener("click",e=>{e.stopPropagation();speak(p.k);});
    box.append(b);});
  return box;}

let jaVoice=null;
function loadVoices(){try{const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().replace("_","-").indexOf("ja")===0);
  jaVoice=vs.find(v=>/kyoko|o-ren|otoya|hattori/i.test(v.name)&&/enhanced|premium/i.test(v.name))||vs.find(v=>v.localService)||vs[0]||null;}catch(e){}}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const canListen=!!SR;
function srError(code){
  if(code==="not-allowed"||code==="service-not-allowed")return "The microphone or speech recognition is blocked. On iPhone, allow the microphone for this site in Safari, and check that Dictation is on (Settings, General, Keyboard, Enable Dictation).";
  if(code==="unsupported")return "This browser can't do speech recognition. Open the app in Safari, or type instead.";
  if(code==="network")return "Speech recognition needs an internet connection.";
  if(code==="empty")return "I didn't catch anything. Tap the mic and try again, a little louder.";
  return "Speech recognition stopped unexpectedly. Try again, or type instead.";}
function listen(cb){
  if(!SR){cb.error("unsupported");return null;}
  try{speechSynthesis.cancel();}catch(e){}
  let r;try{r=new SR();}catch(e){cb.error("unsupported");return null;}
  r.lang="ja-JP";r.interimResults=true;r.maxAlternatives=3;r.continuous=false;
  let last="",alts=[],done=false;
  r.onresult=e=>{let t="";alts=[];for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;
    if(e.results.length===1){const r0=e.results[0];for(let j=0;j<r0.length;j++)alts.push(r0[j].transcript);}
    last=t;if(cb.interim)cb.interim(t);};
  r.onerror=e=>{if(done)return;if(e.error==="no-speech"||e.error==="aborted")return;done=true;cb.error(e.error||"unknown");};
  r.onend=()=>{if(done)return;done=true;const t=last.trim();if(t)cb.final(t,alts.length?alts:[t]);else cb.error("empty");};
  try{r.start();}catch(e){cb.error("start-failed");return null;}
  return {stop(){try{r.stop();}catch(e){}},abort(){done=true;try{r.abort();}catch(e){}}};}
// A mic button: tap to start, tap again to finish.
function micButton(o){const b=btn("mic"+(o.small?" small":""),"はなす");let h=null;
  b.setAttribute("aria-label","Speak");
  b.addEventListener("click",()=>{
    if(h){h.stop();return;}
    b.classList.add("live");b.textContent="きく…";if(o.onStart)o.onStart();
    h=listen({interim:t=>{if(o.onInterim)o.onInterim(t);},
      final:(t,a)=>{h=null;b.classList.remove("live");b.textContent="はなす";o.onText(t,a);},
      error:c=>{h=null;b.classList.remove("live");b.textContent="はなす";if(o.onError)o.onError(c);else toast(srError(c));}});
    if(!h){b.classList.remove("live");b.textContent="はなす";}});
  b.stopListening=()=>{if(h){h.abort();h=null;b.classList.remove("live");b.textContent="はなす";}};
  return b;}

const INTERVALS=[0,10/1440,1,3,7,14,30,60];
function srsNext(s,g){let box=s?s.box:0;
  if(g==="again")box=1;else if(g==="hard")box=Math.max(1,box);else if(g==="good")box=Math.min(7,Math.max(2,box+1));else box=Math.min(7,Math.max(3,box+2));
  return {box:box,due:Date.now()+INTERVALS[box]*DAY};}
function addCard(key,delayDays){if(!S.cards[key])S.cards[key]={box:1,due:Date.now()+(delayDays==null?INTERVALS[1]:delayDays)*DAY};}
function cardInfo(key){const [t,id]=[key.slice(0,1),key.slice(2)];
  if(t==="w"&&W[id])return {key,type:"word",word:res({w:id}),src:LMAP[W[id].L]};
  if(t==="p"&&PMAP[id])return {key,type:"phrase",phrase:PMAP[id],src:LMAP[PMAP[id].L]};
  if(t==="h"&&HMAP[id])return {key,type:"hear",phrase:HMAP[id],src:LMAP[HMAP[id].L]};
  if(t==="c"){const c=S.custom.find(x=>x.id===id);if(c)return {key,type:"phrase",phrase:c,custom:true};}
  if(t==="s"&&SIGNS[+id])return {key,type:"sign",sign:SIGNS[+id]};
  return null;}
function dueKeys(){const now=Date.now();return Object.keys(S.cards).filter(k=>S.cards[k].due<=now&&cardInfo(k)).sort((a,b)=>S.cards[a].due-S.cards[b].due);}
function enrolLesson(L){
  L.words.concat(L.forms).forEach(w=>{if(!NO_SRS_SETS[W[w].set])addCard("w:"+w);});
  L.phrases.forEach(p=>addCard("p:"+p.id));
  L.hear.forEach(h=>addCard("h:"+h.id,1));}
function completeLesson(id){const first=!S.done[id];if(first)S.done[id]=Date.now();const L=LMAP[id];if(L&&!L.kana)enrolLesson(L);logAct("lesson");save();return first;}

function dailySaying(){
  const h=new Date().getHours();
  const open=SAYINGS.filter(s=>S.done[s[1]]);
  if(!open.length)return parseLine(h<11?"ohayou gozaimasu":h<18?"konnichiwa":"konbanwa");

/* ===================== LESSONS ===================== */
function lessonPool(L){return uniq(L.words.concat(L.forms).concat(knownWordIds()));}
function hearPool(L){const out=[];LESSONS.forEach(x=>{if(x.i<=L.i)x.hear.forEach(h=>out.push(h));});L.phrases.forEach(p=>out.push(p));return out;}
function groupWords(L){ // singles in order, sets collapsed where they first appear
  const out=[],seen={};L.words.forEach(id=>{const s=W[id].set;if(!s)out.push({id:id});else if(!seen[s]){seen[s]=1;out.push({set:s,ids:L.words.filter(x=>W[x].set===s)});}});return out;}
function checkQuestions(L,nMean,nOrder){
  const pool=lessonPool(L),steps=[];
  const cand=shuffle(L.words.concat(L.forms));
  cand.slice(0,nMean).forEach(id=>steps.push(stepMeaning(id,pool)));
  const qs=[];
  shuffle(L.phrases.filter(p=>toks(p).length>=2&&toks(p).length<=8&&!toks(p).some(t=>t.name))).slice(0,nOrder).forEach(p=>qs.push({tokens:toks(p),en:p.en}));
  // one fresh sentence built from a pattern, so it can't be answered from memory
  shuffle(L.frames).slice(0,1).forEach(f=>{const wid=pick(f.slot,1)[0];qs.push({tokens:fillFrame(f,wid),en:frameEn(f,wid)});});
  qs.forEach(q=>steps.push(stepOrder(q,pool)));
  return steps;}
function startLesson(id){
  const L=LMAP[id];if(L.kana)return startKanaLesson(id);
  const steps=[];
  steps.push({label:"Lesson "+(L.i+1),render(api){
    api.body.append(el("div","big-kana",L.k));api.body.append(el("div","meaning",L.en));
    api.body.append(el("div","label","After this you can"),el("p","why",L.can));
    api.body.append(el("div","label","The idea"),el("p","why",L.point));
    api.footer(isDone(L.id)?"Practise again":"Start");
    if(!isDone(L.id))api.also("I know this: test me",()=>startTestOut(id),"");}});
  groupWords(L).forEach(g=>steps.push(g.set?stepSet(g.set,g.ids):stepWord(g.id)));
  L.forms.forEach(id=>steps.push(stepWord(id)));
  L.frames.forEach(f=>steps.push(stepFrame(f)));
  L.phrases.slice(0,4).forEach(p=>steps.push(stepBuild(p)));
  if(L.phrases.length>4)steps.push(stepMore(L.phrases.slice(4)));
  const hp=hearPool(L);L.hear.forEach(h=>steps.push(stepHear(h,hp)));
  checkQuestions(L,6,3).forEach(s=>steps.push(s));
  if(canListen)pick(L.phrases.filter(p=>!toks(p).some(t=>t.name)),2).forEach(p=>steps.push(stepSay(p)));
  steps.push(stepLessonDone(L));
  openPlayer({title:L.en,steps:steps});}
function stepLessonDone(L,passedTest){return {label:"Finished",render(api,st){
  if(!st.done){st.done=true;st.first=completeLesson(L.id);}
  const P=api.P;const c=el("div","celebrate");const ch=el("div");ch.innerHTML=charSVG(S.char||"tabinuki",{level:streak(),happy:true});c.append(ch.firstChild);
  const hk=el("div","hanko big"+(st.first?" fresh":""),L.kana?L.k.slice(0,2):String(L.i+1));c.append(hk);
  c.append(el("div","big-kana","おつかれさま"));api.body.append(c);
  const n=L.kana?0:L.words.length+L.forms.length;
  api.body.append(el("p","why",(P.asked?"Checks: "+P.score+" of "+P.asked+" right. ":"")+(L.kana?"Stamp collected.":(st.first?"Stamp collected. ":"")+n+" words and "+L.phrases.length+" phrases are in your review deck. They come back in ten minutes, then spread out as you get them right.")));
  const nx=nextId();
  if(nx){api.footer("Next: "+LMAP[nx].k,()=>{startLesson(nx);});api.also("Done for now",closePlayer);}
  else api.footer("Done",closePlayer);}};}
function startTestOut(id){const L=LMAP[id];const steps=checkQuestions(L,4,3);

const KNUM={"〇":"0","零":"0","一":"1","二":"2","三":"3","四":"4","五":"5","六":"6","七":"7","八":"8","九":"9"};
function normJP(s){return toHira(String(s).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/[〇零一二三四五六七八九]/g,c=>KNUM[c]).replace(/[\s。、．，.,!！?？「」・〜~ー\-]/g,"").toLowerCase());}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let prev=[];for(let j=0;j<=n;j++)prev[j]=j;
  for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur;}return prev[n];}
async function sayCheck(target,transcript,alts){
  const goals=[target.kj,target.kana].filter(Boolean).map(normJP);const cands=uniq([transcript].concat(alts||[])).map(normJP);
  if(cands.some(c=>goals.indexOf(c)>=0))return {verdict:"right"};
  let best=0;cands.forEach(c=>goals.forEach(g=>{const s=1-lev(c,g)/Math.max(c.length,g.length,1);if(s>best)best=s;}));
  if(S.key){
    try{const txt=await callClaude(["A learner of Japanese tried to say a target phrase aloud. A speech recogniser wrote down what it heard.",
      "Target: "+(target.kj||target.kana)+" (reading: "+target.kana+")","Recogniser heard: "+transcript,
      "Decide whether the learner said the target. Ignore differences of script (kanji, kana, digits), punctuation and spacing, and treat homophones as the same.",
      'Answer "match" if it is the same words, "close" if there is one small slip (a particle, or one sound), otherwise "different".',
      'Return only JSON: {"verdict":"match|close|different","kana":"what the recogniser heard, written in hiragana and katakana only"}'].join("\n"),{model:CHEAP_MODEL,max:200});
      const j=parseJSON(txt);return {verdict:j.verdict==="match"?"right":j.verdict==="close"?"close":"wrong",kana:String(j.kana||"")};}
    catch(e){}}
  return {verdict:best>=0.75?"close":"unsure"};}

function startScene(id){const sc=sceneById(id);TALK={scene:id,turns:[],busy:false,err:"",goals:sc.boss?sc.goals.map(()=>false):[],won:false};
  openOverlay({render:renderScene,onClose(){if(TALK.mic)TALK.mic.stopListening();}});askPartner(true);}
function talkPrompt(opening){const sc=sceneById(TALK.scene);
  const lvl=S.level==="known"?"Use ONLY words from the learner's list, plus at most one new word per line. One short sentence per turn."
    :"Mostly use words from the learner's list. You may add up to three new simple words per line. At most two short sentences per turn.";
  const tr=TALK.turns.map(t=>t.who==="them"?"PARTNER: "+t.line.map(x=>x.k).join(" "):"LEARNER: "+t.raw).join("\n")||"(none yet)";
  const mine=S.custom.slice(-12).map(c=>c.line.map(x=>x.k).join(" ")).join(" / ");
  const p=["You are a patient Japanese conversation partner for a beginner. Stay in character as "+sc.role+". Scene: "+sc.setting,
    profileText(),SCRIPT_RULES,
    "Words the learner knows: "+knownKana(),lvl,
    mine?"Phrases the learner has prepared and may try to use: "+mine:"",
    "The learner's lines come from a speech recogniser or from typing, so they may arrive in kanji, kana, romaji or English. Never penalise spelling or script. Answer in character, in Japanese only, and keep the scene moving with something easy to answer.",
    sc.boss?"The learner is trying to do these things during the scene:\n"+sc.goals.map((g,i)=>(i+1)+". "+g).join("\n")+"\nSteer the scene so each one becomes possible, in a natural order.":"",
    "Transcript so far:\n"+tr,
    opening?"Begin the scene with your first line.":"Reply to the learner's last line.",
    "Return only a JSON object with these keys:",
    '"you": the learner\'s last line rewritten in kana and split into words as [{"k":kana,"g":gloss}], or null if there is no learner line yet or it was not Japanese;',
    '"fix": null if the learner\'s last line was natural and correct. Otherwise {"line":[{"k","g"}] a natural way to say what they meant, "en": its English, "why": one short plain-English sentence on the main change};',
    '"line": your next line as [{"k":kana,"g":gloss}];',
    '"en": natural English for your line;',
    '"hint": {"line":[{"k","g"}],"en":""} one short thing the learner could say next, using words from their list;',
    sc.boss?'"goals": an array of '+sc.goals.length+' booleans, true for each goal the learner has achieved so far across the whole transcript;':"",
    '"end": true if the scene has reached its natural end, otherwise false.'];
  return p.filter(Boolean).join("\n");}
async function askPartner(opening){
  TALK.busy=true;TALK.err="";render();
  try{const j=parseJSON(await callClaude(talkPrompt(opening)));
    const line=cleanLine(j.line);if(!line)throw {code:"parse"};
    const me=[...TALK.turns].reverse().find(t=>t.who==="me");
    if(me&&!opening){me.kana=cleanLine(j.you);const fl=j.fix&&cleanLine(j.fix.line);if(fl)me.fix={line:fl,en:String(j.fix.en||""),why:String(j.fix.why||"")};else me.ok=true;}
    TALK.turns.forEach(t=>{t.showHint=false;});
    const hl=j.hint&&cleanLine(j.hint.line);
    TALK.turns.push({who:"them",line:line,en:String(j.en||""),hint:hl?{line:hl,en:String(j.hint.en||"")}:null,gloss:true,showEn:false});
    const sc=sceneById(TALK.scene);
    if(sc.boss&&Array.isArray(j.goals)){TALK.goals=sc.goals.map((g,i)=>!!j.goals[i]||!!TALK.goals[i]);
      if(TALK.goals.every(Boolean)&&!TALK.won){TALK.won=true;if(!S.boss[sc.id]){S.boss[sc.id]=Date.now();TALK.fresh=true;}}}
    TALK.ended=!!j.end;logAct("talk");save();
    TALK.busy=false;render();speak(line.map(x=>x.k).join(""));
  }catch(e){TALK.busy=false;TALK.err=apiError(e);render();}
  const c=$("chatEnd");if(c)c.scrollIntoView({block:"end",behavior:"smooth"});}
function sendLine(text){text=(text||"").trim();if(!text||TALK.busy)return;TALK.turns.push({who:"me",raw:text});askPartner(false);}
function renderScene(m){const sc=sceneById(TALK.scene);
  overlayTop(m,sc.k+" · "+sc.en);
  if(sc.boss){const g=el("div","goals");sc.goals.forEach((x,i)=>{const d=el("div",TALK.goals[i]?"ok":"");d.append(TALK.goals[i]?"✓":"○",el("span",null,x));g.append(d);});
    const t=el("div","banner");t.append(g);m.append(t);}
  const chat=el("div","chat");
  TALK.turns.forEach((tn,i)=>{const last=i===TALK.turns.length-1;
    if(tn.who==="them"){const mm=el("div","msg them");mm.append(el("div","who","あいて · them"));const bub=el("div","bubble");
      bub.append(interlinear(tn.line,{gloss:tn.gloss}));if(tn.showEn)bub.append(el("div","en",tn.en));
      const r=el("div","row");r.append(listenBtn(tn.line.map(x=>x.k).join("")));
      r.append(btn("linkish",tn.gloss?"Hide meanings":"Word meanings",()=>{tn.gloss=!tn.gloss;render();}),btn("linkish",tn.showEn?"Hide English":"English",()=>{tn.showEn=!tn.showEn;render();}));
      if(tn.hint&&last)r.append(btn("linkish",tn.showHint?"Hide idea":"What could I say?",()=>{tn.showHint=!tn.showHint;render();}));
      bub.append(r);
      if(tn.showHint&&tn.hint&&last){const hb=el("div","fix");hb.append(el("div","who","You could say"),interlinear(tn.hint.line,{size:"sm"}),el("div","note",tn.hint.en));bub.append(hb);}
      mm.append(bub);chat.append(mm);}
    else{const mm=el("div","msg me");mm.append(el("div","who","あなた · you"));const bub=el("div","bubble");
      if(tn.kana)bub.append(interlinear(tn.kana,{gloss:false,size:"sm"}));else bub.append(el("div","raw",tn.raw));mm.append(bub);
      if(tn.fix){const f=el("div","fix");f.append(el("div","who","Try it like this"),interlinear(tn.fix.line,{size:"sm"}));
        if(tn.fix.en)f.append(el("div","en",tn.fix.en));if(tn.fix.why)f.append(el("p","note",tn.fix.why));
        const r=el("div","row");r.append(listenBtn(tn.fix.line.map(x=>x.k).join("")));
        const sv=btn("btn small",tn.saved?"Saved to review":"Save to review",()=>{addCustom({line:tn.fix.line,en:tn.fix.en||tn.raw,note:tn.fix.why,src:"talk"});tn.saved=true;render();toast("Saved to your review deck");});sv.disabled=!!tn.saved;r.append(sv);f.append(r);mm.append(f);}
      else if(tn.ok)mm.append(el("div","ok","✓ natural"));
      chat.append(mm);}});
  m.append(chat);
  if(TALK.busy)m.append(el("div","typing","かんがえちゅう…"));
  if(TALK.err){const b=el("div","banner warn");b.append(TALK.err+" ");b.append(btn("linkish","Try again",()=>askPartner(!TALK.turns.some(t=>t.who==="me"))));m.append(b);}
  if(TALK.won){const t=el("div","ticket"),b=el("div","body");const c=el("div","celebrate");c.append(charNode({happy:true}));c.append(el("div","hanko big"+(TALK.fresh?" fresh":""),"★"));
    c.append(el("div","meaning","Every goal done"),el("p","why",TALK.fresh?"Stage stamp collected. Keep chatting, or head back.":"Nicely done. Keep chatting, or head back."));b.append(c);t.append(b);m.append(t);}
  else if(TALK.ended)m.append(el("div","banner","The scene has wrapped up. You can keep talking or close it."));
  m.append(el("div",null,null,{id:"chatEnd"}));
  const bar=el("div","talkbar");bar.style.bottom="calc(12px + env(safe-area-inset-bottom,0px))";
  const input=el("input",null,null,{id:"talkInput",type:"text",placeholder:canListen?"…or type here":"Type in kana, romaji or English",autocomplete:"off",autocapitalize:"off","aria-label":"Your reply"});
  if(canListen){const mic=micButton({small:true,onInterim(t){input.value=t;},onText(t){input.value="";sendLine(t);}});TALK.mic=mic;bar.append(mic);}
  const send=btn("btn primary","Send",()=>{const v=input.value;input.value="";sendLine(v);},"talkSend");
  input.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();send.click();}});
  bar.append(input,send);m.append(bar);
}
function addCustom(c){const id="c"+Date.now().toString(36)+Math.floor(Math.random()*1e3);const item=Object.assign({id:id,at:Date.now()},c);S.custom.push(item);addCard("c:"+id);save();return item;}

let BOOK={tab:"book",q:"",draft:"",busy:false,err:"",result:null};
function phraseRow(p,heard){const it=el("div","pitem"+(heard?" heard":""));const mid=el("div");
  if(heard)mid.append(el("div","who","👂 you'll hear"));
  mid.append(interlinear(toks(p),{size:"sm"}),el("div","en",p.en));
  if(p.note||p.tip)mid.append(el("div","note",p.note||p.tip));
  const right=el("div","col");right.style.alignItems="flex-end";right.append(listenBtn(()=>lineText(toks(p)),"▶"));
  it.append(mid,right);return it;}
function renderBook(m){
  const head=el("div","pagehead");const h=el("h1",null,"ことば");h.append(el("small",null,"Phrases"));head.append(h);
  const seg=el("div","seg");[["book","Phrasebook"],["mine","My phrases"]].forEach(([v,l])=>{const b=btn(null,l,()=>{BOOK.tab=v;render();},"book-"+v);b.setAttribute("aria-pressed",String(BOOK.tab===v));seg.append(b);});
  head.append(seg);m.append(head);
  if(BOOK.tab==="mine")return renderMine(m);
  m.append(el("p","note","Everything in the course, sorted by situation. It works with no signal, so it's your pocket phrasebook on the trip."));
  const input=el("input",null,null,{id:"bookSearch",type:"search",placeholder:"Search in English or かな","aria-label":"Search phrases"});input.value=BOOK.q;m.append(input);
  const list=el("div","col");m.append(list);
  const draw=()=>{list.innerHTML="";const q=BOOK.q.trim().toLowerCase();
    if(q){const hits=[];const test=(p,L,heard)=>{const hay=(p.en+" "+lineSpaced(toks(p))+" "+resolve(toks(p)).map(x=>x.r).join(" ")).toLowerCase();if(hay.indexOf(q)>=0)hits.push([p,heard]);};
      S.custom.forEach(c=>test(c,null,false));LESSONS.forEach(L=>{L.phrases.forEach(p=>test(p,L,false));L.hear.forEach(p=>test(p,L,true));});
      if(!hits.length){list.append(el("div","banner","Nothing matches. Try another word, or build the phrase in My phrases."));return;}
      const pl=el("div","plist");hits.slice(0,40).forEach(([p,heard])=>pl.append(phraseRow(p,heard)));list.append(pl);return;}
    if(S.custom.length){const d=el("details","sect");const s=el("summary");s.append(el("span","jpl","わたしの"),el("span",null,"My phrases"),el("small",null,String(S.custom.length)));d.append(s);
      d.addEventListener("toggle",()=>{if(d.open&&!d.dataset.f){d.dataset.f=1;const pl=el("div","plist");S.custom.slice().reverse().forEach(c=>pl.append(phraseRow(c)));d.append(pl);}});list.append(d);}
    STAGES.forEach(sg=>{list.append(el("div","label",sg.place));
      stageLessons(sg.n).forEach(L=>{const d=el("details","sect");d.id="sect-"+L.id;const s=el("summary");s.append(el("span","jpl",L.k),el("small",null,L.can));d.append(s);
        d.addEventListener("toggle",()=>{if(d.open&&!d.dataset.f){d.dataset.f=1;const pl=el("div","plist");L.phrases.forEach(p=>pl.append(phraseRow(p)));L.hear.forEach(p=>pl.append(phraseRow(p,true)));d.append(pl);}});
        list.append(d);});});};
  let deb=null;input.addEventListener("input",()=>{BOOK.q=input.value;clearTimeout(deb);deb=setTimeout(draw,180);});draw();
}
function minePrompt(text){return ["You help a beginner prepare Japanese phrases for a trip to Japan. "+profileText(),
  'The learner wants to be able to say or handle this: "'+text.replace(/"/g,"'")+'"',
  "Give 1 to 3 short, natural, polite Japanese phrases that do the job, simplest first. Build them from words the learner already knows wherever that still sounds natural.",
  "Words the learner knows: "+knownKana(),SCRIPT_RULES,
  "Return only a JSON object: {\"items\":[{",
  '"line": the phrase as [{"k":kana,"g":gloss}],',
  '"kj": the same phrase in standard Japanese spelling (kanji allowed here; it is only used to match speech recognition),',
  '"en": natural English,',
  '"note": one short sentence on when or how to use it,',
  '"new": [{"k":kana,"g":gloss,"why":"one short sentence on what it means or how it is built"}] for each word in the phrase that is NOT in the learner\'s list (empty array if none),',
  '"hear": [{"line":[{"k","g"}],"kj":"","en":"","tip":"how to reply, using words from the list"}] one or two things a Japanese person is likely to say back',
  "}]}"].join("\n");}
async function buildMine(){const text=BOOK.draft.trim();if(!text||BOOK.busy)return;BOOK.busy=true;BOOK.err="";BOOK.result=null;render();
  try{const j=parseJSON(await callClaude(minePrompt(text),{max:2500}));
    const items=(j.items||[]).map(x=>{const line=cleanLine(x.line);if(!line)return null;
      return {line:line,kj:String(x.kj||""),en:String(x.en||""),note:String(x.note||""),
        new:(Array.isArray(x.new)?x.new:[]).filter(n=>n&&n.k).map(n=>({k:String(n.k),g:String(n.g||""),why:String(n.why||"")})),
        hear:(Array.isArray(x.hear)?x.hear:[]).map(h=>{const hl=cleanLine(h.line);return hl?{line:hl,kj:String(h.kj||""),en:String(h.en||""),tip:String(h.tip||"")}:null;}).filter(Boolean)};}).filter(Boolean);
    if(!items.length)throw {code:"parse"};BOOK.result={ask:text,items:items};
  }catch(e){BOOK.err=apiError(e);}
  BOOK.busy=false;render();}

      b.append(interlinear(it.line,{size:"lg"}),el("div","meaning",it.en));if(it.note)b.append(el("p","why",it.note));
      const r=el("div","row");r.append(listenBtn(it.line.map(x=>x.k).join(""),"▶ HEAR IT"));b.append(r);
      if(it.hear.length){b.append(el("div","label","You'll probably hear"));it.hear.forEach(hh=>{const d=el("div","col");d.style.gap="4px";d.append(interlinear(hh.line,{size:"sm"}));const rr=el("div","row between");rr.append(el("div","en",hh.en),listenBtn(hh.line.map(x=>x.k).join(""),"▶"));d.append(rr);if(hh.tip)d.append(el("div","note",hh.tip));b.append(d);});}
      t.append(b);const f=el("div","foot");const sv=btn("btn primary wide",it.saved?"Saved to my deck":"Save to my deck",()=>{addCustom({line:it.line,kj:it.kj,en:it.en,note:it.note,new:it.new,hear:it.hear,src:"mine",ask:BOOK.result.ask});it.saved=true;render();toast("Saved. It will come up in review and conversations.");},"mineSave-"+i);sv.disabled=!!it.saved;f.append(sv);t.append(f);m.append(t);});}
  if(S.custom.length){const g=el("div","group");const h3=el("h3");h3.append(el("span","jpl","わたしの ことば"),el("small",null,S.custom.length+" saved"));g.append(h3);
    const pl=el("div","plist");S.custom.slice().reverse().forEach(c=>{const it=phraseRow(c);const right=it.lastChild;

  b.append(pk);t.append(b);m.append(t);

  t=el("div","ticket");hd=el("div","head");hd.append(el("span",null,"Your trip"),el("span",null,"Stays on this device"));t.append(hd);b=el("div","body");

  const nprev=el("span","note",S.name?"Used as: "+S.name:"");name.addEventListener("change",()=>{S.name=nameKana(name.value);name.value=S.name;nprev.textContent=S.name?"Used as: "+S.name:"";save();});

  const food=el("textarea",null,null,{id:"setFood",placeholder:"e.g. one vegetarian; one person can't have garlic or onion"});food.value=S.food;food.addEventListener("change",()=>{S.food=food.value.trim();save();});
  b.append(field("Food needs in the group",food,"Sent to Claude only when you start a conversation or build a phrase."));
  const date=el("input",null,null,{id:"setDate",type:"date"});date.value=S.tripDate;date.addEventListener("change",()=>{S.tripDate=date.value;save();});
  b.append(field("First day in Japan",date,"For the countdown on the Today screen."));
  t.append(b);m.append(t);

  t=el("div","ticket");hd=el("div","head");hd.append(el("span",null,"Reading and sound"));t.append(hd);b=el("div","body");
  let row=el("div","row between");row.append(el("span",null,"Romaji under the kana"));let seg=el("div","seg");[[true,"Show"],[false,"Hide"]].forEach(([v,l])=>{const x=btn(null,l,()=>{S.romaji=v;save();applyDisplay();render();},"romaji-"+v);x.setAttribute("aria-pressed",String(S.romaji===v));seg.append(x);});row.append(seg);b.append(row);
  row=el("div","row between");row.append(el("span",null,"Speaking speed"));seg=el("div","seg");[[0.7,"Slow"],[0.85,"Steady"],[1,"Natural"]].forEach(([v,l])=>{const x=btn(null,l,()=>{S.rate=v;save();render();speak("こんにちは");});x.setAttribute("aria-pressed",String(S.rate===v));seg.append(x);});row.append(seg);b.append(row);
  row=el("div","row");row.append(btn("btn small","Test the speaker",()=>{speak("こんにちは。きょう は いい てんき です ね。");toast(jaVoice?"Voice: "+jaVoice.name:"No Japanese voice found on this device");},"testSpeak"));
  if(canListen){const out=el("div","heard grow",SET.micMsg);row.append(micButton({small:true,onInterim(x){out.textContent=x;},onText(x){SET.micMsg="Heard: "+x;out.textContent=SET.micMsg;},onError(c){SET.micMsg=srError(c);out.textContent=SET.micMsg;}}),out);}
  b.append(row);
  b.append(el("p","note",canListen?"Tap the round button, say こんにちは, then tap it again. If it writes down what you said, voice features will work on this device.":"This browser has no speech recognition. Voice features need Safari on iPhone, or Chrome on a computer. Everything else works by typing."));
  t.append(b);m.append(t);
  // API key
  t=el("div","ticket");hd=el("div","head");hd.append(el("span",null,"Claude API key"),el("span",null,S.key?"Saved":"Not set"));t.append(hd);b=el("div","body");
  b.append(el("p","note","Conversations, My phrases and the smarter speech check call Claude with your own key. It is stored only in this browser and sent only to Anthropic. Lessons, review and the phrasebook work without it."));
  const key=el("input",null,null,{id:"setKey",type:"password",placeholder:"sk-ant-…",autocomplete:"off",autocapitalize:"off",spellcheck:"false"});key.value=S.key;key.addEventListener("change",()=>{S.key=key.value.trim();SET.keyMsg="";save();render();});b.append(field("API key",key));

function exportData(){const copy=JSON.parse(JSON.stringify(S));delete copy.key;const blob=new Blob([JSON.stringify(copy)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="tabi-kaiwa-backup-"+today()+".json";document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);toast("Backup saved to your downloads");}
function importData(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j||typeof j!=="object"||!j.done||!j.cards)throw 0;const key=S.key;S=normalize(j);S.key=key||S.key||"";save();applyDisplay();SET.importMsg="Restored: "+stampCount()+" stamps, "+Object.keys(S.cards).length+" cards.";}catch(e){SET.importMsg="That file isn't a Tabi Kaiwa backup.";}render();};r.readAsText(f);}
